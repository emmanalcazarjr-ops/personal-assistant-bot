name: Assistant cron — reminders

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder processor
        run: >
          curl -fsS -X POST
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "${{ vars.APP_URL }}/api/cron-reminders"
